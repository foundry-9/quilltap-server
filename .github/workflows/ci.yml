name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Nothing in CI writes to the repo. Jobs that need more say so themselves.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
# Cancel superseded PR runs outright; on branch pushes let the run finish so
# each commit on main keeps a status of its own (and its Discord post).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Not a real secret — the build and the test suite only require *a* pepper of
  # the right shape to exist.
  ENCRYPTION_MASTER_PEPPER: 'test-pepper-for-ci-environment-32chars!'

jobs:
  # lint / build / test are deliberately NOT chained. They need identical setup
  # and fail for independent reasons, so gating build+test behind lint bought
  # nothing but latency: a lint slip used to hide a build break for a whole
  # round trip. Running them together costs a few runner-minutes on red runs
  # and returns the complete picture in one.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup
      - name: Run ESLint and the spelling sweep
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # --webpack to match what release.yml actually ships. Turbopack and
      # webpack lay out .next/standalone differently, and the tarball's
      # native-stripping only understands webpack's layout (bug 90) — so the
      # release path is webpack-only, and CI has to validate that path rather
      # than a bundler nothing publishes.
      - name: Build Next.js application
        run: npm run build:plugins && npx next build --webpack
        env:
          # Runtime vars aren't needed to prove the app compiles.
          SKIP_ENV_VALIDATION: 'true'
          BASE_URL: 'http://localhost:3000'

      # Nothing downstream consumes the build — this job exists to prove the
      # application still compiles, so the output is checked and discarded.
      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build reported success but .next was never created"
            exit 1
          fi
          echo "✅ Build directory created ($(du -sh .next/ | cut -f1))"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # The CLI's completion suite hands the zsh template to `zsh -n`, and the
      # ubuntu runner image ships without zsh. Absent it the test skips itself
      # rather than failing, so install it here to keep the check honest —
      # this is the only place that check ever runs unattended.
      - name: Install zsh (for the completion-template parse check)
        run: sudo apt-get update && sudo apt-get install -y zsh

      # test:coverage raises the Jest *parent's* heap (--max-old-space-size).
      # With the v8 provider every worker sends back each loaded module's
      # coverage plus its original and transformed source, and the parent holds
      # all of it until the run ends — at ~1,300 test files that outgrew the
      # default ~4 GB. The runner has 16 GB; if this bites again, shard the run.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 30

      # A green suite that produced no coverage summary means the jest config
      # is broken, which is a failure and not a warning — treat it as one.
      - name: Coverage summary
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ Tests passed but coverage/coverage-summary.json is missing — check the jest config"
            exit 1
          fi
          {
            echo "## Test Coverage Summary"
            echo ""
            node -e "
              const total = require('./coverage/coverage-summary.json').total;
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              for (const k of ['lines', 'statements', 'functions', 'branches']) {
                const m = total[k];
                console.log(\`| \${k[0].toUpperCase()}\${k.slice(1)} | \${m.pct}% (\${m.covered}/\${m.total}) |\`);
              }
            "
          } >> "$GITHUB_STEP_SUMMARY"

  discord-notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      # The push event payload carries everything the notification needs, so
      # this checkout is purely to make the local composite action available.
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build the commit embed
        id: embed
        env:
          # Untrusted commit data goes through the environment, never through
          # ${{ }} interpolation into the shell — a commit message is attacker-
          # controlled text and would otherwise be a script-injection vector.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_LOGIN: ${{ github.event.head_commit.author.username || github.event.sender.login }}
          BRANCH: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # Branch deletions and some tag pushes arrive with no head_commit.
          # An empty payload tells the notify action there is nothing to send.
          if [ -z "$COMMIT_URL" ]; then
            echo "::notice::Push carried no head commit — nothing to announce."
            echo "payload=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$AUTHOR_LOGIN" ]; then
            author="$AUTHOR_NAME ([$AUTHOR_LOGIN]($SERVER_URL/$AUTHOR_LOGIN))"
          else
            author="$AUTHOR_NAME"
          fi

          # jq builds the JSON so every value is escaped properly. Discord caps
          # a field value at 1024 characters; the fence and ellipsis fit inside
          # the headroom left by truncating the message at 900.
          payload=$(jq -nc \
            --arg message "$COMMIT_MESSAGE" \
            --arg branch "$BRANCH" \
            --arg author "$author" \
            --arg commit_url "$COMMIT_URL" \
            --arg repo_url "$REPO_URL" \
            --arg timestamp "$COMMIT_TIMESTAMP" \
            '{
              embeds: [{
                title: "GitHub Commit Notification",
                color: 16777215,
                timestamp: $timestamp,
                fields: [
                  {
                    name: "Commit Message",
                    value: ("```\n" + (if ($message | length) > 900
                                       then ($message[0:900] + "\n…(truncated)")
                                       else $message end) + "\n```"),
                    inline: false
                  },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Author", value: $author, inline: false },
                  {
                    name: "Commit Link",
                    value: ("[View Commit](" + $commit_url + ") | [View Repository](" + $repo_url + ")"),
                    inline: false
                  }
                ]
              }]
            }')
          # Delimited form: robust even if a payload ever gains a newline.
          {
            echo "payload<<__PAYLOAD_EOF__"
            printf '%s\n' "$payload"
            echo "__PAYLOAD_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Post the commit to Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          payload: ${{ steps.embed.outputs.payload }}
          description: commit notification

  report:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              skipped) echo "⚠️ Skipped" ;;
              *)       echo "❌ Failed" ;;
            esac
          }
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Lint | $(status '${{ needs.lint.result }}') |"
            echo "| Build | $(status '${{ needs.build.result }}') |"
            echo "| Test | $(status '${{ needs.test.result }}') |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ **CI Pipeline Failed**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ **All CI checks passed!**" >> "$GITHUB_STEP_SUMMARY"
